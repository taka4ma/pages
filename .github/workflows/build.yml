name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install jupyter nbconvert
      - name: Convert notebooks to HTML
        run: |
          mkdir -p public
          shopt -s nullglob
          for f in content/*.ipynb; do
            jupyter nbconvert --to html --output-dir=public "$f"
          done
      - name: Copy markdown as-is
        run: |
          mkdir -p public
          cp -a content/*.md public/ 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
